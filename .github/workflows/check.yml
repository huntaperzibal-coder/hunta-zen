name: PHP checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, curl, fileinfo, dom, gd, exif
          coverage: none
          ini-values: opcache.enable_cli=1, opcache.jit=0
      - run: find app public tools tests -name '*.php' -exec php -l {} \;
      - run: php tests/reader_feedback.php
      - run: php tests/database_backup.php
      - run: php tests/seo.php
      - run: php tests/core.php
      - run: php tests/video.php
      - run: php tests/reader_images.php
      - run: php tests/post_management.php
      - run: php tests/telegram_media.php
      - run: php tests/telegram_channels.php
      - run: php tests/telegram.php
      - run: php tests/auth.php
      - run: php tests/rich_text.php
      - run: php tests/categories.php
      - run: php tests/illustrator.php
      - run: php tests/illustrator_memory.php
      - run: python3 tests/site_archive.py
      - run: python3 tests/backup_download.py
      - run: python3 tests/integration_http.py
      - run: python3 tests/sync.py
      - run: python3 tests/illustrator_install.py
      - run: python3 tests/illustrator_remote.py
      - run: python3 tests/illustrator_actions_install.py
      - run: python3 -m py_compile tools/illustrator_actions.py
      - run: node --check public/assets/js/editor-clipboard.js
      - run: node tests/editor_clipboard.cjs
      - run: node --check public/assets/js/reader-services.js
      - run: node --check public/assets/js/github-hub.js
      - run: node --check public/assets/js/author-settings.js
      - run: node --check public/assets/js/video-preview.js
      - run: node --check public/assets/js/editor.js
      - run: node tests/editor_confirm.cjs
      - run: node --check public/assets/js/illustrator.js
      - run: node --check public/assets/js/editor-help.js
      - run: node --check public/assets/js/reader-actions.js
      - run: node --check public/assets/js/reader-feed.js
      - run: node --check public/assets/js/reader-theme.js
